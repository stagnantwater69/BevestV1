; BeVest wearable unit — ESP32 firmware
; Build:  pio run           Upload: pio run -t upload      Monitor: pio device monitor
;
; Milestone 1 (WiFi + Firebase + safetyResponse handshake) runs on a bare dev board:
; keep SENSORS_SIMULATED = 1 in src/config.h. Flip to 0 per module as boards arrive.

[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; The Firebase + TLS stack is large; the default 1.3 MB app partition is ~84% full
; with sensors OFF and overflows once the sensor libraries link in. huge_app gives
; a 3 MB app slot (drops the unused OTA slot + SPIFFS).
board_build.partitions = huge_app.csv

lib_deps =
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.14
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
    mikalhart/TinyGPSPlus@^1.0.3

build_flags =
    -DCORE_DEBUG_LEVEL=2
